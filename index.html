<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhikr Notifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #fefefe, #f5f5dc);
      text-align: center;
      padding: 50px;
      color: #333;
    }
    h1 {
      font-size: 2.5rem;
      color: #006400; /* Islamic green */
    }
    p {
      font-size: 1.2rem;
      margin: 20px 0;
    }
    .download-btn {
      background: #228B22;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      text-decoration: none;
      border-radius: 10px;
      display: inline-block;
      margin-top: 20px;
      cursor: pointer;
    }
    .download-btn:hover {
      background: #006400;
    }
    .download-btn-py {
      background: #2b87bc;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      text-decoration: none;
      border-radius: 10px;
      display: inline-block;
      margin-top: 20px;
      cursor: pointer;
    }
    .download-btn-py:hover {
      background: #1c577a;
    }
    .download-btn-py:active {
      background: #163f56;
    }
    .download-btn-pyqt {
      background: #ac46cd;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      text-decoration: none;
      border-radius: 10px;
      display: inline-block;
      margin-top: 20px;
      cursor: pointer;
    }
    .download-btn-pyqt:hover {
      background: #803599;
    }
    .download-btn-pyqt:active {
      background: #532064;
    }
    .links {
      margin-top: 40px;
      font-size: 1rem;
    }
    .links a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
    }
    .links a:hover {
      color: #006400;
    }
    footer {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🌙 Dhikr Notifier</h1>
  <p>A simple app to remind you of Allah through Dhikr ✨</p>

  <!-- Main AppImage download -->
  <a href="https://github.com/HamzaNouman/dhikr-notifier/releases/download/v2.0.0/Dhikr-Notifier-x86_64.AppImage" class="download-btn">
    ⬇️ Download for Linux (.AppImage)
  </a><br>

  <p>Please if the app didn't work click on the two buttons below and run them in terminal</p><br>

  <!-- Copy commands to clipboard -->
  <button class="download-btn-py" onclick="copyText('sudo apt install python3 -y')">
    🐍 Copy Python Install Command
  </button>
  <button class="download-btn-pyqt" onclick="copyText('pip install PyQt6')">
    💻 Copy PyQt6 Install Command
  </button>

  <div class="links">
    <a href="https://github.com/HamzaNouman/dhikr-notifier">GitHub</a>
    <a href="https://discord.com/users/1067034294419197992">Discord</a>
  </div>

  <footer>
    <p>Made with ❤️ for the sake of Allah</p>
  </footer>

  <script>
    function copyText(text) {
      navigator.clipboard.writeText(text);
    }
  </script>
</body>
</html>
